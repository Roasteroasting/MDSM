name: Deploy MDSM wiki to GitHub Pages

# Repository Settings > Pages > Source must be set to GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'Wiki/**'
      - '.github/workflows/deploy-wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    # Manual runs must use main too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # The wiki is already static. Upload its contents directly, without a game build.
      - name: Upload wiki
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: Wiki

  deploy:
    # A job boundary avoids deploying before the artifact becomes discoverable.
    needs: upload
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy wiki
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
